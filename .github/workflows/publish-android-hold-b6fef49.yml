name: Publish android-hold-b6fef49

on:
  push:
    paths:
      - '.github/workflows/publish-android-hold-b6fef49.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified APK tarball
        run: |
          set -euo pipefail
          curl -fsSL -o cp-debug-b6fef49.tar.gz https://transfer.archivete.am/MEN3O/cp-debug-b6fef49.tar.gz
          echo '396b07e1ac78077716dac3430641699defe77c31cd9312308da5ce1da9e8f558  cp-debug-b6fef49.tar.gz' | sha256sum -c -
          test "$(wc -c < cp-debug-b6fef49.tar.gz)" -eq 4463146
          tar -xzf cp-debug-b6fef49.tar.gz
          if [ ! -f calculated-plays-debug.apk ]; then
            APK=$(find . -name 'calculated-plays-debug.apk' | head -n1)
            cp "$APK" calculated-plays-debug.apk
          fi
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          b = Path('calculated-plays-debug.apk').read_bytes()
          h = hashlib.sha256(b).hexdigest()
          assert b[:2] == b'PK', b[:8]
          assert len(b) == 4840241, len(b)
          assert h == 'ae40acbaa1fcffbd963f5031b001b3f085cfbd5b95c04588ac818931601e723e', h
          print('apk ok', len(b), h)
          PY

      - name: Create public HOLD release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-hold-b6fef49
          target_commitish: main
          name: HOLD FOR BOSS — debug APK SHA b6fef49 (rail only, no bottom tabs)
          body: |
            HOLD FOR BOSS. Do not send this URL to Eric.

            Sideload debug APK from frontend SHA b6fef49 (PR 79 draft).
            Unfolded Fold OPEN = side rail only. Cover/phone = bottom tabs + More.
            Native-only via html.cp-native / useFoldTabletChrome. Web unchanged.

            Supersedes android-hold-dd2fe9f and android-debug-a94457d when Boss clears.

            Login POST remains https://app.calculatedplays.com/api/auth/login
            CapacitorHttp off. No live bake.

            Size: 4840241 bytes
            SHA256: ae40acbaa1fcffbd963f5031b001b3f085cfbd5b95c04588ac818931601e723e
          files: calculated-plays-debug.apk
          draft: false
          prerelease: true
          make_latest: false
