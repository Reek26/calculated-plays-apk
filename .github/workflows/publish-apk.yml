name: Publish debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble APK from committed base64
        run: |
          set -euo pipefail
          cat chunks/apk.b64.* | base64 -d > calculated-plays-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          b = Path('calculated-plays-debug.apk').read_bytes()
          assert b[:2] == b'PK', b[:8]
          assert len(b) == 4124866, len(b)
          print('apk ok', len(b))
          PY

      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-5695be6
          name: Calculated Plays debug APK (SHA 5695be6)
          body: |
            Sideload debug APK from frontend SHA 5695be6 (PR 77 draft).
            Cold start: splash → login → research home (Slate / Leaders / Stats).
            Password eyeball. Fake 10000 users line removed.
            No GitHub login required on this public repo.
          files: calculated-plays-debug.apk
          draft: false
          prerelease: true
          make_latest: true
