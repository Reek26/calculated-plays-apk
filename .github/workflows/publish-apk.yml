name: Publish debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified APK
        run: |
          set -euo pipefail
          curl -fsSL -o calculated_plays_debug.apk https://tmpfiles.org/dl/1788578580.ddcc3d9fdb807479/w5wZk5UNqzo5/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          b = Path('calculated_plays_debug.apk').read_bytes()
          assert b[:2] == b'PK', b[:8]
          assert len(b) == 4832209, len(b)
          print('apk ok', len(b))
          PY
      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3-login-toggle
          name: Calculated Plays debug APK (login eyeball, no fake 10k)
          body: |
            Sideload debug APK. Cold start is splash → login → research home.
            Login password field has a show/hide eyeball. Fake "10000 users" line removed.
            No GitHub login required on this public repo.
          files: calculated_plays_debug.apk
          draft: false
          prerelease: true
          make_latest: true
