name: Publish android-hold-cd3357c

on:
  push:
    paths:
      - '.github/workflows/publish-android-hold-cd3357c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified APK tarball
        run: |
          set -euo pipefail
          curl -fsSL -o cp-debug-cd3357c.tar.gz https://transfer.archivete.am/HWJML/cp-debug-cd3357c.tar.gz
          echo '624b9a0623a39a7f99fcf153c1b1a7e890c0fa61d6e0d45ba1e3870f21ce23df  cp-debug-cd3357c.tar.gz' | sha256sum -c -
          test "$(wc -c < cp-debug-cd3357c.tar.gz)" -eq 4462955
          tar -xzf cp-debug-cd3357c.tar.gz
          if [ ! -f calculated-plays-debug.apk ]; then
            APK=$(find . -name 'calculated-plays-debug.apk' | head -n1)
            cp "$APK" calculated-plays-debug.apk
          fi
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          b = Path('calculated-plays-debug.apk').read_bytes()
          h = hashlib.sha256(b).hexdigest()
          assert b[:2] == b'PK', b[:8]
          assert len(b) == 4838006, len(b)
          assert h == '05cc5f58f43ebcb384ee0a97b7c5b0e4d39c5707555a30182864aaed16dd894b', h
          print('apk ok', len(b), h)
          PY

      - name: Create public HOLD release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-hold-cd3357c
          target_commitish: main
          name: HOLD FOR BOSS — debug APK SHA cd3357c (rail-only Fold OPEN)
          body: |
            HOLD FOR BOSS. Do not send this URL to Eric.

            Sideload debug APK from frontend SHA cd3357c (PR 79 draft).
            Supersedes android-hold-dd2fe9f (dual-nav leftover: tabs+rail).

            Fold OPEN: side rail only. BottomNav unmounted.
            Cover/phone: bottom tabs + More.
            Native-only via isNativeAndroid / html.cp-native / useFoldTabletChrome.
            Live web unchanged. No bake.

            Login POST remains https://app.calculatedplays.com/api/auth/login
            CapacitorHttp off.

            Size: 4838006 bytes
            SHA256: 05cc5f58f43ebcb384ee0a97b7c5b0e4d39c5707555a30182864aaed16dd894b
          files: calculated-plays-debug.apk
          draft: false
          prerelease: true
          make_latest: false
