name: Publish android-hold-df4987a

on:
  push:
    paths:
      - '.github/workflows/publish-android-hold-df4987a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified APK tarball
        run: |
          set -euo pipefail
          curl -fsSL -o cp-debug-df4987a.tar.gz https://transfer.archivete.am/xkrSI/cp-debug-df4987a.tar.gz
          echo 'a0e35353fe96965dbcbbaf1d92a60274ba7569c95460f3e6794fa80110a167e5  cp-debug-df4987a.tar.gz' | sha256sum -c -
          test "$(wc -c < cp-debug-df4987a.tar.gz)" -eq 4464904
          tar -xzf cp-debug-df4987a.tar.gz
          if [ ! -f calculated-plays-debug.apk ]; then
            APK=$(find . -name 'calculated-plays-debug.apk' | head -n1)
            cp "$APK" calculated-plays-debug.apk
          fi
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          b = Path('calculated-plays-debug.apk').read_bytes()
          h = hashlib.sha256(b).hexdigest()
          assert b[:2] == b'PK', b[:8]
          assert len(b) == 4839434, len(b)
          assert h == '1efa20878152d39b27877b8279041a5633fd9f55a8007d834f8c1b3a4e02f719', h
          print('apk ok', len(b), h)
          PY

      - name: Create public HOLD release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-hold-df4987a
          target_commitish: main
          name: HOLD FOR BOSS — debug APK SHA df4987a (phone/cover v7 ~390 CSS)
          body: |
            HOLD FOR BOSS. Do not send this URL to Eric.

            Sideload debug APK from frontend SHA df4987a (PR 79 draft).
            Phone/cover ~390 CSS HOF scale. Fold OPEN tablet/rail frozen.
            Native-only via html.cp-native. Web unchanged.

            Size: 4839434 bytes
            SHA256: 1efa20878152d39b27877b8279041a5633fd9f55a8007d834f8c1b3a4e02f719
          files: calculated-plays-debug.apk
          draft: false
          prerelease: true
          make_latest: false
