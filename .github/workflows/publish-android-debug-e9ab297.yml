name: Publish android-debug-e9ab297

on:
  push:
    paths:
      - '.github/workflows/publish-android-debug-e9ab297.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified APK tarball
        run: |
          set -euo pipefail
          curl -fsSL -o cp-debug-538434f.tar.gz https://transfer.archivete.am/UEbEB/cp-debug-538434f.tar.gz
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          b = Path('cp-debug-538434f.tar.gz').read_bytes()
          h = hashlib.sha256(b).hexdigest()
          assert h == 'b3ab4ee82551f115f660bef372a7b4b92d52889148f6f5bba03e67ebce31dae7', h
          assert len(b) == 4463226, len(b)
          print('tarball ok', len(b), h)
          PY
          tar -xzf cp-debug-538434f.tar.gz
          test -f calculated-plays-debug.apk || find . -name 'calculated-plays-debug.apk' -print
          if [ ! -f calculated-plays-debug.apk ]; then
            find . -name '*.apk' -print
            tar -tzf cp-debug-538434f.tar.gz
            APK=$(find . -name 'calculated-plays-debug.apk' | head -n1)
            cp "$APK" calculated-plays-debug.apk
          fi
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          b = Path('calculated-plays-debug.apk').read_bytes()
          h = hashlib.sha256(b).hexdigest()
          assert b[:2] == b'PK', b[:8]
          assert len(b) == 4838971, len(b)
          assert h == 'ae297549a0de3bf07478d8585dae3c28b18dbec337f44fae88a61f8b0437ff0d', h
          print('apk ok', len(b), h)
          PY

      - name: Create public HOLD release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-e9ab297
          target_commitish: main
          name: HOLD FOR BOSS — debug APK SHA e9ab297 (native Fold only)
          body: |
            HOLD FOR BOSS. Do not send this URL to Eric.

            Sideload debug APK. Frontend gate SHA e9ab297 (PR 79 draft).
            Fold tablet chrome is Capacitor Android only
            (isNativeAndroid / html.cp-native / useFoldTabletChrome).
            Public web is unchanged.

            Login POST remains https://app.calculatedplays.com/api/auth/login
            CapacitorHttp off.

            Size: 4838971 bytes
            SHA256: ae297549a0de3bf07478d8585dae3c28b18dbec337f44fae88a61f8b0437ff0d
          files: calculated-plays-debug.apk
          draft: false
          prerelease: true
          make_latest: false
