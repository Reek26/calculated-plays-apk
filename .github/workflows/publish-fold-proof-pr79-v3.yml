name: Publish Fold-OPEN PR79 v3 proofs

on:
  push:
    paths:
      - '.github/workflows/publish-fold-proof-pr79-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish PNGs to docs/fold-proof-pr79-v3
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          curl -fsSL -o fold-proof-pr79-v3.tar.gz https://transfer.archivete.am/CVgyk/fold-proof-pr79-v3.tar.gz
          echo '3c0d164d7ba9986d38c0c9c738d2cb9cd9e9320a6961c0cffccc9b6c46df11fe  fold-proof-pr79-v3.tar.gz' | sha256sum -c -
          test "$(wc -c < fold-proof-pr79-v3.tar.gz)" -eq 4044739
          tar -xzf fold-proof-pr79-v3.tar.gz
          mkdir -p docs/fold-proof-pr79-v3
          cp fold-proof-pr79-v3/fold-open-v3-home.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-open-v3-home-scrolled.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-open-v3-rail.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-open-v3-stats-player.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-open-v3-leaders.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-open-v3-trends.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-open-v3-bonuses.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-cover-v3-tabs.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-cover-v3-904.png docs/fold-proof-pr79-v3/
          cp fold-proof-pr79-v3/fold-cover-phone-more.png docs/fold-proof-pr79-v3/
          python3 - <<'PY'
          from pathlib import Path
          expect = {
            'fold-open-v3-home.png': 804531,
            'fold-open-v3-home-scrolled.png': 804509,
            'fold-open-v3-rail.png': 804511,
            'fold-open-v3-stats-player.png': 278878,
            'fold-open-v3-leaders.png': 205203,
            'fold-open-v3-trends.png': 250818,
            'fold-open-v3-bonuses.png': 209172,
            'fold-cover-v3-tabs.png': 179245,
            'fold-cover-v3-904.png': 674793,
            'fold-cover-phone-more.png': 41676,
          }
          root = Path('docs/fold-proof-pr79-v3')
          for name, size in expect.items():
              b = (root / name).read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', name
              assert len(b) == size, (name, len(b))
              print('png ok', name, len(b))
          readme = root / 'README.md'
          readme.write_text(
              'PR 79 v3 Fold proofs (SHA cd3357c).\n\n'
              'Fold OPEN = side rail, no BottomNav. Cover/phone = bottom tabs + More.\n\n'
              'OPEN: fold-open-v3-home.png, fold-open-v3-rail.png\n'
              'Cover: fold-cover-v3-tabs.png, fold-cover-v3-904.png\n'
          )
          print('readme ok', readme.stat().st_size)
          PY
          git add docs/fold-proof-pr79-v3
          git diff --cached --quiet && echo 'no proof changes' || git commit -m 'Publish PR79 Fold-OPEN v3 proofs (cd3357c) to docs/fold-proof-pr79-v3.'
          git push origin HEAD:main
